services:
  - type: web
    name: clearroute-sg
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/locations
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
